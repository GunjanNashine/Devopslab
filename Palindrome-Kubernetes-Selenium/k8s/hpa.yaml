apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: palindrome-app-hpa
  labels:
    app: palindrome-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: palindrome-app-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
