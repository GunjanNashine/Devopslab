apiVersion: v1
kind: Service
metadata:
  name: palindrome-checker
  labels:
    app: palindrome-app
    project: devops-lab-11
spec:
  type: NodePort
  selector:
    app: palindrome-app
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: palindrome-app-service
  labels:
    app: palindrome-app
    project: devops-lab-11
spec:
  type: NodePort
  selector:
    app: palindrome-app
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30082
