apiVersion: apps/v1
kind: Deployment
metadata:
  name: palindrome-app-deployment
  labels:
    app: palindrome-app
    tier: frontend
    project: devops-lab-11
spec:
  replicas: 2
  selector:
    matchLabels:
      app: palindrome-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: palindrome-app
        tier: frontend
    spec:
      containers:
        - name: palindrome-container
          image: palindrome-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-port
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
